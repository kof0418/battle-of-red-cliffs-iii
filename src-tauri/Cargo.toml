[package]
name = "three-kingdoms-battle"
version = "2.2.2"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }


# Keep macro dylibs intact: older Rust strip can misalign LINKEDIT on new macOS.
[profile.release]
strip = "none"
[profile.release.build-override]
strip = "none"
[profile.dev]
strip = "none"
[profile.dev.build-override]
strip = "none"
