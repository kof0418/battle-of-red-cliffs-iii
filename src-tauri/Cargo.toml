[package]
name = "three-kingdoms-battle"
version = "1.3.6"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }

rfd = "0.15"
serde_json = "1"

# Keep macro dylibs intact: older Rust strip can misalign LINKEDIT on new macOS.
[profile.release]
strip = "none"
[profile.release.build-override]
strip = "none"
[profile.dev]
strip = "none"
[profile.dev.build-override]
strip = "none"
