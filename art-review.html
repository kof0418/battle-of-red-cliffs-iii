<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>五將造型檢視</title><style>body{margin:0;background:#18282b;color:#dbc798;font-family:serif}h1,p{text-align:center}canvas{display:block;margin:auto;max-width:100%}</style><h1>赤旌 · 五將造型細化</h1><p>待機　／　行走　／　出招　／　躍起　／　反向</p><div id="review"></div><script type="module">
import Phaser from 'phaser';import {Actor} from './src/actor.ts';import {Campaign} from './src/combat.ts';import {HERO_IDS,HEROES} from './src/heroes.ts';
new Phaser.Game({type:Phaser.CANVAS,width:960,height:790,parent:'review',backgroundColor:'#223537',pixelArt:true,scene:{create(){HERO_IDS.forEach((id,row)=>{const f=new Campaign(id).hero;this.add.text(20,row*155+65,HEROES[id].name,{fontSize:'23px',color:'#dfca98'});for(let c=0;c<5;c++){const a=new Actor(this,row*10+c);const pose={...f,x:210+c*155,y:row*155+130,z:c===3?16:0,face:c===4?-1:1,moving:c===1};if(c===2)pose.attack={elapsed:.2,impact:.18,duration:.5,hit:true};pose.step=2;a.draw(pose,c===1?.2:0);}});}}});
</script></html>
